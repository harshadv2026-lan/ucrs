spring.profiles.active=demo
server.port=8080
spring.application.name=ucrs
ucrs.demo.mode=true

# Admin credentials (used in demo/auth)
ucrs.admin.username=admin
ucrs.admin.password=admin123
ucrs.admin.name=System Administrator

# Registration business rules
ucrs.registration.max-semester-credits=20

# Neo4j Graph Database Configuration
ucrs.neo4j.enabled=true
ucrs.neo4j.uri=bolt://localhost:7687
ucrs.neo4j.username=neo4j
ucrs.neo4j.password=password
