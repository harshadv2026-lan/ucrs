# Oracle Configuration
# To use Oracle: copy this file's content to application.properties and fill in your Oracle details.
# Also ensure ojdbc11.jar is installed to your local Maven repository (see pom.xml comments).

spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/XEPDB1
spring.datasource.username=${ORACLE_USER}
spring.datasource.password=${ORACLE_PASS}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

ucrs.demo.mode=false
